<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Taxi Safety Map - Interactive</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --text: #e5e7eb; --muted: #9ca3af; 
      --accent: #60a5fa; --ok: #10b981; --border: #334155;
    }
    * { box-sizing: border-box; }
    html, body { 
      margin:0; padding:0; height:100%; overflow:hidden;
      background:var(--bg); color:var(--text); 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
    }
    
    .container {
      display: flex;
      height: 100vh;
      position: relative;
      flex-direction: row-reverse; /* panel on the left */
    }
    
    /* Map */
    #map {
      flex: 1;
      height: 100%;
      background: #ffffff;
    }
    
    /* Side Panel */
    .side-panel {
      width: 420px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    
    .panel-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    
    .panel-header h1 {
      margin: 0 0 16px 0;
      font-size: 20px;
      font-weight: 700;
    }
    
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .control-group {
      flex: 1;
      min-width: 120px;
    }
    
    .control-group label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input, select, button {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
    }
    
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    /* Zone Info */
    .zone-info {
      padding: 20px;
      display: none;
    }
    
    .zone-info.active {
      display: block;
    }
    
    .zone-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .zone-subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }
    
    .safety-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .safety-high { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .safety-medium { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    .safety-low { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin: 24px 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }
    
    .chart-container {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    
    .recommendations {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .rec-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .rec-item:last-child {
      border-bottom: none;
    }
    
    .rec-time {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      min-width: 70px;
    }
    
    .rec-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .rec-bar-fill {
      height: 100%;
      background: var(--ok);
      border-radius: 4px;
    }
    
    .placeholder {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    
    .placeholder-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    /* Loading */
    .loading {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .spinner {
      width: 56px;
      height: 56px;
      border: 6px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Leaflet overrides */
    .leaflet-popup-content-wrapper {
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    /* Hide Bronx Park zones */
    .leaflet-interactive[data-zone-id="21"],
    .leaflet-interactive[title*="Bronx Park"] {
      display: none !important;
    }
    
    .leaflet-popup-content {
      margin: 16px;
    }
    
    .leaflet-popup-tip {
      background: var(--panel);
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column; /* stack on mobile */
      }
      .side-panel {
        width: 100%;
        height: 50vh;
        border-right: none;
        border-top: 1px solid var(--border);
      }
      #map {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

      <div class="zone-info" id="zoneInfo">

        <div class="stats-grid">

          </div>
          <div class="stat-card">

          </div>
          <div class="stat-card">

          <div class="stat-card">

        </div>
        
        <div class="section-title">⏰ Safety by Hour</div>
        <div class="chart-container">

        <div class="section-title">✨ Safest Times</div>

  </div>

    // Add a custom Central Park zone
    function addCentralParkZone() {
      // Central Park square rotated to the right
      const centralParkBounds = [
        [40.7800, -73.9680], // Southwest corner
        [40.7800, -73.9630], // Southeast corner
        [40.7850, -73.9630], // Northeast corner
        [40.7850, -73.9680]  // Northwest corner
      ];
      
      // Create Central Park polygon
      const centralParkPolygon = L.polygon(centralParkBounds, {
        fillColor: '#10b981', // Green for safety
        weight: 2,
        opacity: 0.8,
        color: '#059669', // Darker green border
        fillOpacity: 0.3,
        className: 'central-park-zone'
      }).addTo(map);
      
      // Add popup and click handler
      centralParkPolygon.bindPopup(`
        <strong>Central Park</strong><br/>
        <small>Manhattan</small><br/>
        <em>Click for details</em>
      `);
      
      // Add click handler to load Central Park details
      centralParkPolygon.on('click', () => {
        // Find Central Park zone in data or create mock data
        const centralParkZone = Object.values(zonesData).find(z => 
          z.zone_name && z.zone_name.toLowerCase().includes('central park')
        );
        
        if (centralParkZone) {
          loadZoneDetails(centralParkZone.PULocationID);
            } else {
          // Create mock Central Park data if not found in backend
          showCentralParkMockData();
        }
      });
      
      // Store reference for highlighting
      window.centralParkLayer = centralParkPolygon;
      
      console.log('Central Park zone added to map');
    }
    
    // Show mock Central Park data if not found in backend
    function showCentralParkMockData() {
      // Show zone info panel
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('zoneInfo').classList.add('active');
      
      // Populate with Central Park mock data
      document.getElementById('zoneName').textContent = 'Central Park';
      document.getElementById('zoneBorough').textContent = 'Manhattan';
      
      const safetyBadge = `<span class="safety-high">85%</span>`;
      document.getElementById('safetyIndex').innerHTML = safetyBadge;
      
      document.getElementById('totalRides').textContent = '12,450';
      document.getElementById('avgDistance').textContent = '2.3 mi';
      document.getElementById('avgFare').textContent = '$8.50';
      
      // Mock hourly data for Central Park
      const mockHourlyData = Array.from({length: 24}, (_, i) => ({
        pickup_hour: i,
        hourly_safety: Math.max(0.6, 0.8 - Math.abs(i - 14) * 0.02), // Peak safety around 2 PM
        rides: Math.floor(Math.random() * 500) + 200
      }));
      
      renderHourlyChart(mockHourlyData);
      
      // Mock safest hours
      const mockSafestHours = [
        { pickup_hour: 14, hourly_safety: 0.85 },
        { pickup_hour: 15, hourly_safety: 0.82 },
        { pickup_hour: 13, hourly_safety: 0.80 }
      ];
      
      renderRecommendations(mockSafestHours);
      
      // Navigate to Central Park
      map.setView([40.7829, -73.9654], 15);
      
      // Highlight the Central Park polygon
      if (window.centralParkLayer) {
        window.centralParkLayer.setStyle({ weight: 4, color: '#1e40af' });
      }
    }

    // GeoJSON loading functions removed - using Leaflet geocoding only

    function getProp(props, keys) {
      for (const k of keys) {
        if (props[k] != null) return props[k];
      }
      return undefined;
    }

    function toZoneId(props) {
      const raw = getProp(props, ['locationid','LocationID','location_id']);
      const id = Number(raw);
      return Number.isFinite(id) ? id : null;
    }
    
    // Get color for safety index
    function getSafetyColor(safety) {
      if (safety >= 0.7) return '#10b981'; // Green
      if (safety >= 0.4) return '#fbbf24'; // Yellow
      return '#ef4444'; // Red
    }
    
    // Get safety badge class
    function getSafetyClass(safety) {
      if (safety >= 0.7) return 'safety-high';
      if (safety >= 0.4) return 'safety-medium';
      return 'safety-low';
    }
    
    function highlightZoneLayer(zoneId) {
      console.log('Attempting to highlight zone:', zoneId);
      console.log('Available zone layers:', Object.keys(zoneLayersById));
      
      // Reset previous highlight
      if (highlightedLayer) {
        highlightedLayer.setStyle({ weight: 1, color: '#334155' });
      }
      
      const layer = zoneLayersById[zoneId];
      if (!layer) {
        console.error('Zone layer not found for ID:', zoneId);
        // Try to find the layer by searching through all layers
        if (zoneLayer) {
          let foundLayer = null;
          zoneLayer.eachLayer((l) => {
            const props = l.feature.properties || {};
            const layerZoneId = toZoneId(props);
            if (layerZoneId === zoneId) {
              foundLayer = l;
            }
          });
          
          if (foundLayer) {
            console.log('Found layer by searching:', foundLayer);
            highlightedLayer = foundLayer;
            foundLayer.setStyle({ weight: 3, color: '#93c5fd' });
            try { foundLayer.bringToFront && foundLayer.bringToFront(); } catch(_) {}
            
            // Pan/zoom to the selected zone
            const bounds = foundLayer.getBounds();
            if (bounds && bounds.isValid()) {
              console.log('Navigating to bounds:', bounds);
              map.fitBounds(bounds, { maxZoom: 14, padding: [20, 20] });
            } else {
              console.error('Invalid bounds for zone:', zoneId);
            }
          } else {
            console.error('Could not find layer for zone:', zoneId);
          }
        }
        return;
      }
      
      highlightedLayer = layer;
      layer.setStyle({ weight: 3, color: '#93c5fd' });
      try { layer.bringToFront && layer.bringToFront(); } catch(_) {}
      
      // Pan/zoom to the selected zone
      const bounds = layer.getBounds();
      if (bounds && bounds.isValid()) {
        console.log('Navigating to bounds:', bounds);
        map.fitBounds(bounds, { maxZoom: 14, padding: [20, 20] });
      } else {
        console.error('Invalid bounds for zone:', zoneId);
        // Fallback: try to get center and zoom
        try {
          const center = layer.getCenter();
          if (center) {
            console.log('Using center fallback:', center);
            map.setView(center, 14);
          }
        } catch (e) {
          console.error('Center fallback failed:', e);
        }
      }
      
      // Open popup
      layer.openPopup();

        clearTimeout(searchTimeout);

        clearSearchResults();
        return;

      searchTimeout = setTimeout(async () => {

    // Dual search function - separate navigation and information
    async function performSearch(query) {
      console.log('Searching for:', query);
      
      // 1. ALWAYS use Leaflet for map navigation (reliable)
        try {
          const geocodeResult = await geocodeLocation(query);
          if (geocodeResult) {
          console.log('Leaflet found location:', geocodeResult);
            showLocationOnMap(geocodeResult);
        } else {
          console.log('Leaflet found no results for:', query);

        } catch (error) {
        console.error('Leaflet geocoding error:', error);
      }
      
      // 2. SEPARATELY try to find backend data for information
      try {
        const backendData = await findBackendData(query);
        if (backendData) {
          console.log('Backend found data:', backendData.zone_name);
          showBackendInfo(backendData);
        } else {
          console.log('No backend data found, showing basic info');
          showBasicInfo(query);
        }
      } catch (error) {
        console.error('Backend search error:', error);
        showBasicInfo(query);
      }
    }
    
    // Find backend data for a location
    async function findBackendData(query) {
      const lowerQuery = query.toLowerCase();
      
      // Try exact matches first
      let match = Object.values(zonesData).find(z => 
        z.zone_name && z.zone_name.toLowerCase() === lowerQuery
      );
      
      if (match) {
        console.log('Exact backend match:', match.zone_name);
        return match;
      }
      
      // Try partial matches
      const partialMatches = Object.values(zonesData).filter(z => 
        z.zone_name && z.zone_name.toLowerCase().includes(lowerQuery)
      );
      
      if (partialMatches.length > 0) {
        console.log('Partial backend match:', partialMatches[0].zone_name);
        return partialMatches[0];
      }
      
      // Try landmark matches
      const landmarkMatch = findLandmarkMatch(query);
      if (landmarkMatch) {
        console.log('Landmark backend match:', landmarkMatch.zone_name);
        return landmarkMatch;
      }
      
      return null;
    }

    // Find the nearest zone to given coordinates
    function findNearbyZone(lat, lng) {
      let nearestZone = null;
      let minDistance = Infinity;
      
      // Check all available zones
      Object.values(zonesData).forEach(zone => {
        // For now, we'll use a simple distance calculation
        // In a real implementation, you'd want to check if the point is within the zone polygon
        const distance = Math.sqrt(Math.pow(lat - 40.7589, 2) + Math.pow(lng - (-73.9851), 2));
        if (distance < minDistance) {
          minDistance = distance;
          nearestZone = zone;
        }
      });
      
      return nearestZone;
    }

    // Find matches for common NYC landmarks with more accurate zone names
    function findLandmarkMatch(query) {
      const lowerQuery = query.toLowerCase();
      
      // Special handling for Times Square - prioritize zone 161 (exists in GeoJSON)
      if (lowerQuery.includes('times square') || lowerQuery.includes('times')) {
        console.log('Searching for Times Square zones...');
        
        // First try zone 161 (exists in both GeoJSON and backend)
        if (zonesData[161]) {
          console.log('Using zone 161 for Times Square:', zonesData[161].zone_name);
          return zonesData[161];
        }
        
        // Fallback to any Times Square related zones
        const timesSquareZones = Object.values(zonesData).filter(z => 
          z.zone_name && z.zone_name.toLowerCase().includes('times')
        );
        
        console.log('Found Times Square zones:', timesSquareZones.map(z => z.zone_name));
        
        if (timesSquareZones.length > 0) {
          return timesSquareZones[0];
        }
      }
      
      // Special handling for Central Park - try multiple approaches
      if (lowerQuery.includes('central park') || lowerQuery.includes('central')) {
        console.log('Searching for Central Park zones...');
        
        // Try exact Central Park matches first
        const centralParkZones = Object.values(zonesData).filter(z => 
          z.zone_name && (
            z.zone_name.toLowerCase().includes('central park') ||
            z.zone_name.toLowerCase() === 'central park' ||
            z.zone_name.toLowerCase().includes('central park north') ||
            z.zone_name.toLowerCase().includes('central park south')
          )
        );
        
        console.log('Found Central Park zones:', centralParkZones.map(z => z.zone_name));
        
        if (centralParkZones.length > 0) {
          // Return the first Central Park zone found
          return centralParkZones[0];
        }
        
        // If no Central Park zones found in data, return a special marker
        // This will trigger the custom Central Park handling
        return { PULocationID: 'central-park-custom', zone_name: 'Central Park', borough: 'Manhattan' };
        
        // If no Central Park zones found, try Manhattan zones that might be near Central Park
        const manhattanZones = Object.values(zonesData).filter(z => 
          z.zone_name && z.borough && z.borough.toLowerCase().includes('manhattan') &&
          (z.zone_name.toLowerCase().includes('upper east') ||
           z.zone_name.toLowerCase().includes('upper west') ||
           z.zone_name.toLowerCase().includes('midtown'))
        );
        
        console.log('Found Manhattan zones near Central Park:', manhattanZones.map(z => z.zone_name));
        
        if (manhattanZones.length > 0) {
          return manhattanZones[0];
        }
      }
      
      // More comprehensive landmark mapping based on actual NYC taxi zones
      const landmarks = {
        'times square': ['Times Sq/Theatre District'],
        'brooklyn bridge': ['Brooklyn Bridge', 'DUMBO/Vinegar Hill'],
        'wall street': ['Financial District North', 'Financial District South'],
        'soho': ['SoHo', 'Hudson Sq'],
        'greenwich village': ['West Village', 'Greenwich Village'],
        'east village': ['East Village', 'Lower East Side'],
        'upper east side': ['Upper East Side North', 'Upper East Side South'],
        'upper west side': ['Upper West Side North', 'Upper West Side South'],
        'harlem': ['Harlem North', 'Harlem South', 'East Harlem North', 'East Harlem South'],
        'chinatown': ['Chinatown', 'Two Bridges'],
        'little italy': ['Little Italy/NoLiTa', 'NoHo'],
        'chelsea': ['Chelsea', 'Hudson Yards'],
        'flatiron': ['Flatiron', 'Gramercy'],
        'union square': ['Union Sq', 'Union Square'],
        'madison square': ['Madison Sq', 'Madison Square'],
        'grand central': ['Grand Central/Midtown East', 'Midtown East'],
        'penn station': ['Penn Station/Madison Sq West', 'Penn Station'],
        'jfk': ['JFK Airport', 'Airport'],
        'laguardia': ['LaGuardia Airport', 'Airport'],
        'newark': ['Newark Airport', 'Airport'],
        'prospect park': ['Prospect Park', 'Prospect Heights'],
        'coney island': ['Coney Island', 'Brighton Beach'],
        'brighton beach': ['Brighton Beach', 'Coney Island'],
        'astoria': ['Astoria', 'Astoria Boulevard'],
        'long island city': ['Long Island City', 'LIC'],
        'williamsburg': ['Williamsburg', 'Williamsburg North', 'Williamsburg South'],
        'dumbo': ['DUMBO/Vinegar Hill', 'Brooklyn Heights'],
        'park slope': ['Park Slope', 'Gowanus'],
        'red hook': ['Red Hook', 'Carroll Gardens']
      };
      
      for (const [key, possibleZones] of Object.entries(landmarks)) {
        if (lowerQuery.includes(key) || key.includes(lowerQuery)) {
          // Try to find any of the possible zone names
          for (const zoneName of possibleZones) {
            const match = Object.values(zonesData).find(z => 
              z.zone_name && z.zone_name.includes(zoneName)
            );
            if (match) {
              return match;
            }
          }
        }
      }
      return null;
    }
    
    function clearSearchResults() {
      searchResults = [];
    }
    
    // Geocode location using OpenStreetMap Nominatim
    async function geocodeLocation(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', New York, NY')}&limit=1&addressdetails=1`;
      
      try {
        const response = await fetch(url);
        const results = await response.json();
        
        if (results && results.length > 0) {
          const result = results[0];
          return {
            lat: parseFloat(result.lat),
            lng: parseFloat(result.lon),
            name: result.display_name,
            address: result.address
          };
        }
      } catch (error) {
        console.error('Geocoding failed:', error);
      }
      return null;
    }
    
    // Show location on map with marker
    function showLocationOnMap(location) {
      // Remove existing markers
      if (window.searchMarker) {
        map.removeLayer(window.searchMarker);
      }
      
      // Add marker for searched location
      window.searchMarker = L.marker([location.lat, location.lng])
        .addTo(map)
        .bindPopup(`
          <strong>${location.name}</strong><br/>
          <small>Lat: ${location.lat.toFixed(4)}, Lng: ${location.lng.toFixed(4)}</small>
        `)
        .openPopup();
      
      // Center map on location
      map.setView([location.lat, location.lng], 15);
      
      // Try to find taxi zone for this location
      const zone = findTaxiZoneForLocation(location.lat, location.lng);
      if (zone) {
        const zoneId = toZoneId(zone.feature.properties);
        if (zoneId && zonesData[zoneId]) {
          // Highlight the zone
          zone.setStyle({ weight: 3, color: '#ff6b6b' });
          
          // Show zone info
          setTimeout(() => {
            loadZoneDetails(zoneId);
          }, 1000);
        }
      }
    }
    
    // Find the taxi zone that contains a location
    function findTaxiZoneForLocation(lat, lng) {
      if (!zoneLayer) return null;
      
      const point = L.latLng(lat, lng);
      let containingZone = null;
      
      // First try to find a zone that contains the point
      zoneLayer.eachLayer((layer) => {
        if (L.GeometryUtil && L.GeometryUtil.isMarkerInsidePolygon(point, layer)) {
          containingZone = layer;
          return false; // Stop searching
        }
      });
      
      // If no containing zone found, find the nearest one
      if (!containingZone) {
        let nearestZone = null;
        let minDistance = Infinity;
        
        zoneLayer.eachLayer((layer) => {
          const bounds = layer.getBounds();
          const distance = point.distanceTo(bounds.getCenter());
          
          if (distance < minDistance) {
            minDistance = distance;
            nearestZone = layer;
          }
        });
        
        containingZone = nearestZone;
      }
      
      return containingZone;
    }

    document.getElementById('month').addEventListener('change', () => {
      loadZones();
      document.getElementById('placeholder').style.display = 'block';
      document.getElementById('zoneInfo').classList.remove('active');
    });

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }
    
    // Initialize
    initMap();
    loadZones();
