<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Late Night Safety Index</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #111827; --text: #e5e7eb; --muted: #9ca3af; --accent: #60a5fa; --ok: #10b981;
    }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { padding:16px; background:var(--panel); display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
    header h1 { margin:0; font-size:18px; }
    input, select, button { background:#0b1220; color:var(--text); border:1px solid #1f2937; border-radius:6px; padding:8px 10px; }
    button { background:var(--accent); border:none; cursor:pointer; }
    main { padding:16px; display:grid; gap:16px; grid-template-columns: 1fr; }
    .cards { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; }
    .card { background:var(--panel); padding:16px; border-radius:10px; }
    .label { color:var(--muted); font-size:12px; }
    .value { font-size:22px; font-weight:700; margin-top:6px; }
    .panel { background:var(--panel); padding:16px; border-radius:10px; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding:8px; border-bottom:1px solid #1f2937; text-align:left; font-size:14px; }
    th { color:var(--muted); font-weight:600; }
    .toolbar { display:flex; gap:8px; align-items:center; }
    .loading { position:fixed; inset:0; background:rgba(15,23,42,0.7); display:none; align-items:center; justify-content:center; z-index:999; }
    .spinner { width:56px; height:56px; border:6px solid #1f2937; border-top-color: var(--accent); border-radius:50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="loading" id="loading"><div class="spinner"></div></div>
  <header>
    <h1>NYC Late Night Safety Index</h1>
    <div class="toolbar">
      <label class="label" for="apiBase">API</label>
      <input id="apiBase" value="http://127.0.0.1:5000" style="min-width:260px" />
      <label class="label" for="month">Month</label>
      <select id="month">
        <option value="2023-01">2023-01</option>
        <option value="2023-02">2023-02</option>
        <option value="2023-03">2023-03</option>
        <option value="2023-04">2023-04</option>
      </select>
      <button id="reload">Reload</button>
    </div>
  </header>
  <main>
    <section class="cards">
      <div class="card">
        <div class="label">Total rides (00:00–03:59 solo)</div>
        <div class="value" id="totalRides">—</div>
      </div>
      <div class="card">
        <div class="label">Avg distance (mi)</div>
        <div class="value" id="avgDistance">—</div>
      </div>
      <div class="card">
        <div class="label">Avg fare ($)</div>
        <div class="value" id="avgFare">—</div>
      </div>
    </section>

    <section class="panel">
      <h3 style="margin-top:0">Hourly trends</h3>
      <canvas id="hourlyChart" height="90"></canvas>
    </section>

    <section class="panel">
      <h3 style="margin-top:0">Zone safety table</h3>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Zone</th>
              <th>Borough</th>
              <th>Total rides</th>
              <th>Avg distance</th>
              <th>Avg fare</th>
              <th>Safety index</th>
            </tr>
          </thead>
          <tbody id="zoneBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const qs = (id) => document.getElementById(id);
    const showLoading = (show) => qs('loading').style.display = show ? 'flex' : 'none';
    let chart;

    function getApiBase() { return qs('apiBase').value.trim().replace(/\/$/, ''); }
    function getMonth() { return qs('month').value; }

    async function fetchJson(path) {
      const url = `${getApiBase()}${path}${path.includes('?') ? '&' : '?'}month=${encodeURIComponent(getMonth())}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Request failed: ${resp.status}`);
      return resp.json();
    }

    function fmt(x, digits=2) {
      if (x === null || x === undefined || Number.isNaN(x)) return '—';
      return Number(x).toFixed(digits);
    }

    async function loadData() {
      try {
        showLoading(true);
        const [summary, hourly, zones] = await Promise.all([
          fetchJson('/summary'),
          fetchJson('/hourly-trends'),
          fetchJson('/zone-stats')
        ]);

        // Summary cards
        qs('totalRides').textContent = summary.total_rides?.toLocaleString?.() ?? summary.total_rides ?? '—';
        qs('avgDistance').textContent = fmt(summary.avg_distance);
        qs('avgFare').textContent = fmt(summary.avg_fare);

        // Hourly chart
        const labels = Array.from({length:24}, (_,i)=> i);
        const data = labels.map(h => hourly[h] || 0);
        if (chart) chart.destroy();
        const ctx = qs('hourlyChart').getContext('2d');
        chart = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets: [{ label: 'Rides', data, backgroundColor: '#60a5fa' }]},
          options: {
            responsive: true,
            scales: { x: { grid: { color:'#1f2937' }}, y: { grid: { color:'#1f2937' }, beginAtZero: true }},
            plugins: { legend: { display:false } }
          }
        });

        // Zone table (sorted by safety index desc)
        const body = qs('zoneBody');
        body.innerHTML = '';
        const sorted = [...zones].sort((a,b)=> (b.safety_index??0) - (a.safety_index??0));
        for (const z of sorted) {
          const tr = document.createElement('tr');
          const safetyPct = z.safety_index == null ? '—' : `${Math.round(z.safety_index * 100)}%`;
          tr.innerHTML = `
            <td>${z.zone_name ?? z.PULocationID ?? ''}</td>
            <td>${z.borough ?? ''}</td>
            <td>${z.total_rides?.toLocaleString?.() ?? z.total_rides ?? ''}</td>
            <td>${fmt(z.avg_distance)}</td>
            <td>${fmt(z.avg_fare)}</td>
            <td>${safetyPct}</td>
          `;
          body.appendChild(tr);
        }
      } catch (err) {
        alert('Failed to load data: ' + (err?.message || err));
      } finally {
        showLoading(false);
      }
    }

    qs('reload').addEventListener('click', loadData);
    qs('month').addEventListener('change', loadData);
    window.addEventListener('load', loadData);
  </script>
</body>
</html>
